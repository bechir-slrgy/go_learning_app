services:
  db:
    image: postgres:17
    container_name: taskdb
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - taskdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d tasks"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  taskdata:
